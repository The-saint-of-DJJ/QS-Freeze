[project]
name = "stk11-slc7a2-discovery"
version = "1.0.0"
description = "Cross-fitted computational discovery of an SLC7A2 expression marker for STK11 mutation in TCGA-LUAD"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.9",
  "statsmodels>=0.13",
  "matplotlib>=3.7",
  "networkx>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
